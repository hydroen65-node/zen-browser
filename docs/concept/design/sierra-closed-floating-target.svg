<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="825" viewBox="0 0 1410 825">
  <defs>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172529"/><stop offset=".52" stop-color="#182024"/><stop offset="1" stop-color="#1b1d21"/></linearGradient>
    <linearGradient id="sidebar" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1c2b2f" stop-opacity=".92"/><stop offset="1" stop-color="#1a2024" stop-opacity=".98"/></linearGradient>
    <radialGradient id="blueLight"><stop stop-color="#d6e5ff" stop-opacity=".98"/><stop offset=".16" stop-color="#a4c9ff" stop-opacity=".8"/><stop offset=".48" stop-color="#79afff" stop-opacity=".28"/><stop offset="1" stop-color="#79afff" stop-opacity="0"/></radialGradient>
    <radialGradient id="amberLight"><stop stop-color="#fff1d8" stop-opacity=".95"/><stop offset=".18" stop-color="#f2cda0" stop-opacity=".7"/><stop offset=".5" stop-color="#e4ad79" stop-opacity=".23"/><stop offset="1" stop-color="#e4ad79" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02070b" flood-opacity=".47"/></filter>
    <filter id="lightblur"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="pageClip"><rect x="238" y="42" width="1164" height="775" rx="12"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
      .chrome{fill:#dce5e7;font-size:12px}
      .muted{fill:#94a4a9;font-size:11px}
      .site{fill:#d7dddf;font-size:14px}
      .siteMuted{fill:#93a2a6;font-size:12px}
      .icon{fill:none;stroke:#b1c3c6;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Window frame and one continuous tinted sidebar/gutter material -->
  <rect width="1410" height="825" fill="url(#frame)"/>
  <rect x="0" y="0" width="234" height="825" fill="url(#sidebar)"/>
  <path d="M233.5 0V825" stroke="#91b6b8" stroke-opacity=".14"/>
  <rect x="238" y="42" width="1164" height="775" rx="12" fill="#172123"/>

  <!-- Native window controls and browsing actions -->
  <circle cx="19" cy="21" r="5.2" fill="#ff675f"/><circle cx="39" cy="21" r="5.2" fill="#f5bf4f"/><circle cx="59" cy="21" r="5.2" fill="#53c36b"/>
  <path class="icon" d="M104 21h12m-6-5-5 5 5 5M141 21h12m-5-5 5 5-5 5M180 16a7 7 0 1 1-4 12m4-12v5h-5"/>

  <!-- Pinned tabs: icon and text remain simple, one divider, no headings -->
  <rect x="10" y="57" width="212" height="34" rx="9" fill="#a6c4c5" fill-opacity=".11"/>
  <rect x="21" y="65" width="18" height="18" rx="4" fill="#e3e7e7"/>
  <text x="30" y="78" text-anchor="middle" fill="#243333" font-size="11" font-weight="700">M</text>
  <text x="48" y="79" class="chrome">MDN reference</text>
  <rect x="21" y="105" width="18" height="16" rx="3" fill="#638a82"/>
  <path d="M21 109h7l3 3h8" stroke="#bcd9d0" stroke-width="1.3" fill="none"/>
  <text x="48" y="118" class="chrome">Browser project</text>
  <path d="M17 145H218" stroke="#dce7e8" stroke-opacity=".14"/>

  <!-- A provenance Trail with readable nesting -->
  <rect x="10" y="159" width="212" height="34" rx="9" fill="#d6e6e5" fill-opacity=".14"/>
  <rect x="21" y="168" width="16" height="16" rx="3" fill="#e3e7e7"/>
  <text x="29" y="180" text-anchor="middle" fill="#223234" font-size="10" font-weight="700">M</text>
  <text x="47" y="181" class="chrome">Browser extensions</text>
  <path d="M28 194v62m0-38h13m0 18h12" stroke="#7e9a9d" stroke-opacity=".55" stroke-width="1.2" fill="none"/>
  <text x="47" y="214" class="muted">↳</text><text x="61" y="214" class="chrome" fill-opacity=".8">Key resources</text>
  <rect x="52" y="228" width="15" height="15" rx="3" fill="#e1e6e8"/>
  <text x="59.5" y="239" text-anchor="middle" fill="#42545a" font-size="9" font-weight="700">C</text>
  <text x="75" y="240" class="chrome" fill-opacity=".8">API reference</text>
  <text x="21" y="284" class="muted">+</text><text x="43" y="284" class="muted">New Tab</text>

  <!-- Sidebar agent dock: identities, no fake running state -->
  <path d="M16 767H218" stroke="#dce7e8" stroke-opacity=".13"/>
  <ellipse cx="34" cy="794" rx="25" ry="16" fill="url(#blueLight)" transform="rotate(-16 34 794)"/>
  <ellipse cx="77" cy="794" rx="22" ry="15" fill="url(#amberLight)" transform="rotate(12 77 794)"/>
  <path class="icon" d="M120 789v12m-6-6h12"/>
  <text x="204" y="799" class="muted" text-anchor="end">⌄</text>

  <!-- Realistic reading page; the browser does not repaint site content -->
  <g clip-path="url(#pageClip)">
    <g transform="translate(0 34)">
    <rect x="238" y="8" width="1164" height="809" fill="#172123"/>
    <rect x="238" y="8" width="1164" height="54" fill="#202a2d"/>
    <text x="257" y="41" fill="#e2e9e9" font-size="26" font-weight="700" letter-spacing="-1.6">mdn</text>
    <text x="347" y="39" class="siteMuted">HTML</text><text x="414" y="39" class="siteMuted">CSS</text><text x="470" y="39" class="siteMuted">JavaScript</text><text x="565" y="39" class="siteMuted">Web APIs</text>
    <path d="M252 63H1388" stroke="#64777b" stroke-opacity=".38"/>
    <text x="260" y="91" class="siteMuted">Mozilla</text><text x="317" y="91" class="siteMuted">›</text><text x="337" y="91" class="siteMuted">Add-ons</text><text x="400" y="91" class="siteMuted">›</text><text x="421" y="91" class="siteMuted">Browser extensions</text>
    <path d="M252 105H1388" stroke="#64777b" stroke-opacity=".25"/>
    <text x="258" y="150" fill="#e6ecec" font-size="30" font-weight="650" letter-spacing="-.6">Browser extensions</text>
    <text x="258" y="183" class="siteMuted">Extensions add capabilities to the browser using web technologies.</text>
    <text x="258" y="221" class="site" font-weight="600">On this page</text>
    <text x="259" y="251" class="siteMuted">Key resources</text><text x="259" y="278" class="siteMuted">Get started</text><text x="259" y="305" class="siteMuted">Concepts</text>
    <text x="259" y="332" class="siteMuted">User interface</text><text x="259" y="359" class="siteMuted">Reference</text>
    <path d="M436 211V386" stroke="#769399" stroke-opacity=".32"/>
    <text x="475" y="232" fill="#e4ebea" font-size="21" font-weight="600">Key resources</text>
    <text x="475" y="272" class="site">Build, test, and publish browser extensions with the</text>
    <text x="475" y="296" class="site">WebExtensions APIs and familiar web tools.</text>
    <rect x="475" y="332" width="470" height="92" rx="10" fill="#253235" stroke="#759396" stroke-opacity=".18"/>
    <text x="492" y="360" fill="#dfe8e7" font-size="14" font-weight="550">Guides and tutorials</text>
    <text x="492" y="384" class="siteMuted">Learn the anatomy of an extension and the browser APIs.</text>
    <text x="492" y="407" fill="#a7d8da" font-size="12">Explore guides  →</text>
    <text x="475" y="486" fill="#e4ebea" font-size="21" font-weight="600">Get started</text>
    <text x="475" y="524" class="site">Start with a small extension, then add permissions</text>
    <text x="475" y="548" class="site">only when a feature needs them.</text>
    <text x="475" y="618" fill="#e4ebea" font-size="21" font-weight="600">Concepts</text>
    <text x="475" y="656" class="site">Understand content scripts, background tasks, and</text>
    <text x="475" y="680" class="site">the UI surfaces available to an extension.</text>
    </g>
  </g>

  <!-- Closed black cut-out and site identity below it -->
  <path d="M584 0Q608 0 608 22Q608 38 624 38H786Q802 38 802 22Q802 0 826 0Z" fill="#050607"/>
  <path d="M608 22Q608 38 624 38H786Q802 38 802 22" fill="none" stroke="#dce9e9" stroke-opacity=".11"/>
  <rect x="567" y="4" width="30" height="30" rx="10" fill="#050607" stroke="#dce9e9" stroke-opacity=".13"/>
  <text x="582" y="25" text-anchor="middle" fill="#e7ebeb" font-size="17" font-weight="700">M</text>
  <rect x="617" y="40" width="176" height="28" rx="10" fill="#080b0d" stroke="#dce9e9" stroke-opacity=".16"/>
  <text x="705" y="58" text-anchor="middle" fill="#dce5e5" font-size="11.5">Browser extensions</text>

  <!-- Floating agent sheet, theme-aware and integrated with the page -->
  <g filter="url(#shadow)">
    <rect x="1009" y="111" width="381" height="448" rx="20" fill="#222d32" stroke="#b5d1d2" stroke-opacity=".22"/>
  </g>
  <ellipse cx="1046" cy="144" rx="27" ry="15" fill="url(#blueLight)" transform="rotate(-16 1046 144)"/>
  <text x="1074" y="148" fill="#e7eeed" font-size="13" font-weight="600">Agent task</text>
  <text x="1168" y="148" class="muted">Saved</text>
  <rect x="1315" y="127" width="26" height="26" rx="7" fill="#dce8e8" fill-opacity=".07"/>
  <path d="M1322 143h12m-8-7h8v7" class="icon"/>
  <path d="M1361 136l10 10m0-10-10 10" class="icon"/>
  <path d="M1028 169H1371" stroke="#e2eded" stroke-opacity=".12"/>
  <rect x="1028" y="183" width="19" height="19" rx="4" fill="#e3e7e7"/>
  <text x="1037.5" y="197" text-anchor="middle" fill="#243333" font-size="11" font-weight="700">M</text>
  <text x="1057" y="197" class="chrome">Browser extensions · MDN</text>
  <path d="M1028 216H1371" stroke="#e2eded" stroke-opacity=".12"/>
  <text x="1028" y="246" class="muted">Activity</text>
  <circle cx="1032" cy="276" r="3" fill="#a9caff"/>
  <text x="1045" y="280" class="chrome">Read this page</text>
  <text x="1369" y="280" class="muted" text-anchor="end">4,283 chars</text>
  <path d="M1028 293H1371" stroke="#e2eded" stroke-opacity=".1"/>
  <text x="1028" y="430" class="muted">Task</text>
  <rect x="1028" y="442" width="343" height="70" rx="10" fill="#131b1f" fill-opacity=".54" stroke="#dbe9e8" stroke-opacity=".19"/>
  <text x="1041" y="465" class="chrome">Summarize the WebExtensions</text>
  <text x="1041" y="484" class="chrome">API overview</text>
  <rect x="1029" y="530" width="9" height="9" rx="2" fill="none" stroke="#b9cccd" stroke-opacity=".7"/>
  <text x="1044" y="539" class="muted">Keep this agent</text>
  <rect x="1297" y="520" width="74" height="29" rx="8" fill="#dce9e8"/>
  <text x="1334" y="539" text-anchor="middle" fill="#1e292b" font-size="11" font-weight="600">Save task</text>
</svg>
