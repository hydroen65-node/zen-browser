ference</text><text x="513" y="129" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#99999f">Mozilla  /  Add-ons  /  WebExtensions</text><text x="513" y="190" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="600" fill="#eee">Browser extensions</text><text x="513" y="237" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#c4c4c8">Extensions add features and functions to a browser.</text><text x="513" y="264" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#c4c4c8">Build extensions using familiar web technologies:</text><text x="513" y="291" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#c4c4c8">JavaScript, HTML, and CSS.</text><text x="513" y="356" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#eee">Developing extensions</text><text x="513" y="397" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#c7c7c9">Explore the tools and APIs for working with tabs, pages,</text><text x="513" y="424" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#c7c7c9">bookmarks, and browser windows.</text><rect x="513" y="463" width="576" height="127" rx="8" fill="#222225"/><text x="536" y="496" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="500" fill="#9ec2ff">WebExtensions APIs</text><text x="536" y="530" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#c7c7c9">tabs  ·  windows  ·  bookmarks  ·  webRequest</text><text x="536" y="562" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9ec2ff">Browse the API reference →</text><text x="1175" y="130" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ddd">In this article</text><text x="1175" y="162" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#aaa">Develo